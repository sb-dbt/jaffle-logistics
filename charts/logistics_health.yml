style:
  font:
    family: "system-ui"
extends: "paper"
title: "Jaffle Logistics health"
source: logistics

queries:
  delivery_performance:
    sql: |
      select
          month,
          'On-time delivery' as metric,
          ontime_pct as value
      from SB_ANALYTICS.DBT_SBERG.FCT_ACCOUNT_HEALTH
      where client_name = 'Jaffle Equipment'

      union all

      select
          month,
          'SLA target' as metric,
          sla_target as value
      from SB_ANALYTICS.DBT_SBERG.FCT_ACCOUNT_HEALTH
      where client_name = 'Jaffle Equipment'

      order by month, metric

  delivery_inflection_points:
    sql: |
      with annotated as (
          select
              ts,
              citation_url,
              score,
              case
                  when citation_url = 'jaffle_logistics://crm_note/CRM-9001'
                      then 'Chicago winter storm hits service'
                  when citation_url = 'jaffle_logistics://call_transcript/CT-99021'
                      then 'Performance keeps sliding after storm recovery'
                  when citation_url = 'jaffle_logistics://incident_report/IR-9003'
                      then 'Recurring Columbus handling pattern confirmed'
                  when citation_url = 'jaffle_logistics://call_transcript/CT-99022'
                      then 'Root cause and remediation shared with customer'
              end as inflection_point,
              case
                  when citation_url = 'jaffle_logistics://crm_note/CRM-9001'
                      then 'The January Chicago storm delayed a large freight batch, drove ticket volume, and triggered an SLA credit plus a written recovery plan.'
                  when citation_url = 'jaffle_logistics://call_transcript/CT-99021'
                      then 'On-time performance and ticket volume worsened again after storm recovery, showing that a second cause remained unresolved.'
                  when citation_url = 'jaffle_logistics://incident_report/IR-9003'
                      then 'A third handling incident tied recurring damage and mispicks to Bay 3 at the Columbus hub; the bay was cordoned and an operating-procedure audit began.'
                  when citation_url = 'jaffle_logistics://call_transcript/CT-99022'
                      then 'The account team separated the one-time storm impact from the recurring Columbus handling pattern and explained the remediation to the customer.'
              end as context
          from SB_ANALYTICS.DBT_SBERG.SEARCH
          where demo = 'jaffle_equipment_performance_issues_classified'
            and citation_url in (
                'jaffle_logistics://crm_note/CRM-9001',
                'jaffle_logistics://call_transcript/CT-99021',
                'jaffle_logistics://incident_report/IR-9003',
                'jaffle_logistics://call_transcript/CT-99022'
            )
      )

      select
          ts as event_date,
          inflection_point,
          context,
          citation_url
      from annotated
      qualify row_number() over (
          partition by citation_url
          order by score desc
      ) = 1
      order by event_date

  customer_burden:
    sql: |
      select
          month,
          'Support tickets' as event_type,
          ticket_count as events
      from SB_ANALYTICS.DBT_SBERG.FCT_ACCOUNT_HEALTH
      where client_name = 'Jaffle Equipment'

      union all

      select
          month,
          'Incidents' as event_type,
          incident_count as events
      from SB_ANALYTICS.DBT_SBERG.FCT_ACCOUNT_HEALTH
      where client_name = 'Jaffle Equipment'

      order by month, event_type

  incidents_by_type:
    sql: |
      select
          incident_type,
          count(*) as incidents
      from SB_ANALYTICS.DBT_SBERG.FCT_INCIDENTS
      group by incident_type
      order by incidents desc

  account_kpis:
    sql: |
      select
          client_name,
          round(avg(ontime_pct), 1) as avg_ontime_pct,
          round(avg(sla_target), 1) as sla_target_pct,
          round(
              100.0 * avg(case when ontime_vs_target >= 0 then 1 else 0 end),
              1
          ) as sla_attainment_pct,
          sum(ticket_count) as support_tickets,
          sum(incident_count) as incidents
      from SB_ANALYTICS.DBT_SBERG.FCT_ACCOUNT_HEALTH
      group by client_name
      order by avg_ontime_pct

charts:
  delivery_performance:
    type: line
    query: delivery_performance
    x: month
    y: value
    color: metric
    title: "On-time delivery vs. SLA target"

  delivery_inflection_points_table:
    type: table
    query: delivery_inflection_points
    title: "Inflection points behind the delivery curve"

  customer_burden:
    type: bar
    query: customer_burden
    x: month
    y: events
    color: event_type
    title: "Support tickets and incidents by month"

  incident_mix:
    type: bar
    query: incidents_by_type
    x: incident_type
    y: incidents
    color: incident_type
    title: "Incidents by type"

  account_kpis_table:
    type: table
    query: account_kpis
    title: "Account health KPIs"

rows:
  - title: "Jaffle Equipment delivery performance"
    rows:
      - delivery_performance
      - delivery_inflection_points_table
  - title: "Customer and operational burden"
    cols:
      - customer_burden
      - incident_mix
  - title: "Account comparison"
    rows:
      - account_kpis_table
